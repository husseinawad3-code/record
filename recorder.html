<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مسجّل الصوت الذكي</title>
<style>
  :root{
    --bg:#F5F3EC; --card:#EBE8DF; --text:#1B1D21; --muted:#6C7079;
    --track:#DCD8CC; --rec:#1E7A4C; --stop:#B23A2E; --line:#B23A2E; --border:#C8C4B8;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#15171A; --card:#20232A; --text:#F1F0EA; --muted:#9AA0AA;
    --track:#2E323A; --border:#3A3F48;
  }}
  :root[data-theme="dark"]{
    --bg:#15171A; --card:#20232A; --text:#F1F0EA; --muted:#9AA0AA;
    --track:#2E323A; --border:#3A3F48;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  .top{text-align:center;margin-top:12px}
  .status{font-size:18px;font-weight:600;min-height:24px}
  .time{font-size:64px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
  .hint{font-size:13px;color:var(--muted);margin-top:6px;min-height:18px}
  .meter{margin-top:28px}
  .track{position:relative;height:14px;border-radius:7px;background:var(--track)}
  .fill{height:100%;width:0;border-radius:7px;background:var(--muted);transition:width .05s linear}
  .fill.on{background:var(--rec)}
  .thr{position:absolute;top:-5px;width:3px;height:24px;background:var(--line);border-radius:2px;transform:translateX(50%)}
  .labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:14px}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:240px}
  .big{width:180px;height:180px;border-radius:50%;border:0;color:#fff;font-size:20px;font-weight:700;background:var(--rec);
       -webkit-tap-highlight-color:transparent;transition:transform .08s}
  .big:active{transform:scale(.97)}
  .big.live{background:var(--stop)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border-radius:12px;padding:12px 14px}
  .item .name{font-size:13px;color:var(--muted);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item audio{width:100%;height:36px}
  .item .acts{display:flex;gap:8px;margin-top:8px}
  .err{color:var(--stop);font-size:14px;text-align:center;margin-top:10px}
</style>
</head>
<body>
  <div class="top">
    <div class="status" id="status">جاهز</div>
    <div class="time" id="time">00:00</div>
    <div class="hint">مدة الصوت المحفوظ فعليًا (بدون فترات الصمت)</div>
  </div>

  <div class="meter">
    <div class="track">
      <div class="fill" id="fill"></div>
      <div class="thr" id="thr"></div>
    </div>
    <div class="labels"><span id="lvl">—</span><span>الحد: <span id="thrv">-45</span> dB</span></div>
  </div>
  <div class="row">
    <button class="chip" id="more">أكثر حساسية</button>
    <button class="chip" id="less">أقل حساسية</button>
  </div>

  <div class="center">
    <button class="big" id="big">ابدأ التسجيل</button>
    <div class="hint" id="sub"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="list" id="list"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SILENCE_MS = 3000;   // مدة الصمت قبل الإيقاف المؤقت — وتُحذف من الملف النهائي
  const PREROLL = 3;         // عدد المقاطع المحفوظة قبل بداية الكلام حتى لا يُقص أوله
  let threshold = -45;       // dBFS
  let stream, ctx, proc, src, wake;
  let live = false, gateOpen = false, lastVoice = 0;
  let outRate = 16000, factor = 1;
  let saved = [], pending = [], preroll = [], savedSamples = 0, pendingSamples = 0;

  const fmt = ms => { const s = Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
  const pct = db => Math.max(0, Math.min(1, (db+60)/60));
  const drawThr = () => { $("thr").style.right = (pct(threshold)*100)+"%"; $("thrv").textContent = threshold; };
  drawThr();
  $("more").onclick = () => { threshold = Math.max(-70, threshold-2); drawThr(); };
  $("less").onclick = () => { threshold = Math.min(-20, threshold+2); drawThr(); };
  const setStatus = (t, s) => { $("status").textContent = t; $("sub").textContent = s||""; };

  // تحويل مقطع Float32 إلى Int16 مع تقليل معدل العينات (متوسط كل factor عينة)
  function toInt16(f32){
    const n = Math.floor(f32.length / factor);
    const out = new Int16Array(n);
    for (let i=0;i<n;i++){
      let s = 0; for (let k=0;k<factor;k++) s += f32[i*factor+k];
      s /= factor; s = Math.max(-1, Math.min(1, s));
      out[i] = s < 0 ? s*32768 : s*32767;
    }
    return out;
  }

  async function start(){
    $("err").textContent = "";
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    } catch(e) {
      $("err").textContent = "لم يُسمح باستخدام الميكروفون. اسمح بالإذن من إعدادات المتصفح.";
      return;
    }
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (ctx.state === "suspended") await ctx.resume();
    factor = Math.max(1, Math.round(ctx.sampleRate / 16000));
    outRate = Math.round(ctx.sampleRate / factor);
    src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    saved = []; pending = []; preroll = []; savedSamples = 0; pendingSamples = 0;
    gateOpen = false; lastVoice = performance.now();
    proc.onaudioprocess = onChunk;
    src.connect(proc); proc.connect(ctx.destination);   // الاتصال بالوجهة لازم كي يعمل المعالج في iOS
    live = true;
    $("big").textContent = "إيقاف وحفظ"; $("big").classList.add("live");
    setStatus("متوقف مؤقتًا — في انتظار الصوت", "سيبدأ التسجيل تلقائيًا عندما تتكلم");
    try { wake = await navigator.wakeLock?.request("screen"); } catch(_){}
  }

  function onChunk(e){
    if (!live) return;
    const f32 = e.inputBuffer.getChannelData(0);
    let s = 0; for (let i=0;i<f32.length;i++) s += f32[i]*f32[i];
    const rms = Math.sqrt(s/f32.length);
    const db = rms > 0 ? 20*Math.log10(rms) : -160;
    const now = performance.now();
    const voiced = db > threshold;
    const pcm = toInt16(f32);

    if (voiced) lastVoice = now;

    if (!gateOpen) {
      if (voiced) {
        gateOpen = true;
        for (const c of preroll) { saved.push(c); savedSamples += c.length; }
        preroll = [];
        saved.push(pcm); savedSamples += pcm.length;
        setStatus("يسجّل", "");
      } else {
        preroll.push(pcm); if (preroll.length > PREROLL) preroll.shift();
      }
    } else if (voiced) {
      // رجع الكلام قبل انقضاء 3 ثوانٍ: الصمت القصير يُحفظ ليبقى الكلام طبيعيًا
      for (const c of pending) { saved.push(c); savedSamples += c.length; }
      pending = []; pendingSamples = 0;
      saved.push(pcm); savedSamples += pcm.length;
    } else {
      pending.push(pcm); pendingSamples += pcm.length;
      if (now - lastVoice >= SILENCE_MS) {
        // انقضت 3 ثوانٍ صمت: تُحذف كلها ولا تدخل الملف
        pending = []; pendingSamples = 0;
        gateOpen = false;
        setStatus("متوقف مؤقتًا — في انتظار الصوت", "سيُستأنف التسجيل تلقائيًا عندما تتكلم");
      }
    }

    $("time").textContent = fmt(savedSamples / outRate * 1000);
    $("fill").style.width = (pct(db)*100)+"%";
    $("fill").classList.toggle("on", gateOpen && voiced);
    $("lvl").textContent = db <= -100 ? "—" : db.toFixed(0)+" dB";
  }

  function stop(){
    live = false;
    try { src.disconnect(); proc.disconnect(); } catch(_){}
    stream.getTracks().forEach(t => t.stop());
    ctx.close(); wake?.release?.();
    // الصمت المعلّق في النهاية لا يُحفظ
    pending = []; pendingSamples = 0; gateOpen = false;
    $("big").textContent = "ابدأ التسجيل"; $("big").classList.remove("live");
    setStatus("جاهز", ""); $("fill").style.width = "0"; $("lvl").textContent = "—";
    finish();
  }

  function buildWav(chunks, rate){
    const n = chunks.reduce((a,c)=>a+c.length,0);
    const buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf);
    const str = (o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i, s.charCodeAt(i)); };
    str(0,"RIFF"); dv.setUint32(4, 36+n*2, true); str(8,"WAVE"); str(12,"fmt ");
    dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,rate,true); dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
    str(36,"data"); dv.setUint32(40, n*2, true);
    let off = 44; for (const c of chunks){ new Int16Array(buf, off, c.length).set(c); off += c.length*2; }
    return new Blob([buf], { type:"audio/wav" });
  }

  function finish(){
    const ms = savedSamples / outRate * 1000;
    if (!saved.length) { $("time").textContent = "00:00"; return; }
    const blob = buildWav(saved, outRate);
    const name = "تسجيل-" + new Date().toLocaleString("sv-SE").replace(/[: ]/g,"-") + ".wav";
    const url = URL.createObjectURL(blob);
    const item = document.createElement("div"); item.className = "item";
    item.innerHTML = `<div class="name">${name} · ${fmt(ms)}</div>
      <audio controls src="${url}"></audio>
      <div class="acts"><button class="chip">حفظ الملف</button><button class="chip">حذف</button></div>`;
    const [save, del] = item.querySelectorAll("button");
    save.onclick = () => { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
    del.onclick = () => { URL.revokeObjectURL(url); item.remove(); };
    $("list").prepend(item);
    saved = []; savedSamples = 0;
  }

  $("big").onclick = () => live ? stop() : start();
})();
</script>
</body>
</html>
